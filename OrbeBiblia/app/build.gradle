plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orbebiblia.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.orbebiblia.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Para publicar en Play Store, configura aquí tu propia firma (signingConfig).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Anuncios (AdMob): banner + intersticial con límite
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    // Formulario de consentimiento (obligatorio para usuarios de la UE/Reino Unido)
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
    // Compartir la tarjeta del paso como imagen (FileProvider)
    implementation 'androidx.core:core:1.13.1'
    // Suscripción mensual "Premium sin anuncios"
    implementation 'com.android.billingclient:billing:7.1.1'
}
