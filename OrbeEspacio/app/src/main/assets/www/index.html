<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#03050c">
  <title>Orbe Espacio</title>
  <link rel="stylesheet" href="css/espacio.css">
  <link rel="stylesheet" href="css/uhd.css">
</head>
<body>
  <div id="defs-host"></div>
  <div id="globe" aria-label="Globo terráqueo con satélites en órbita"></div>
  <div id="overlay" aria-hidden="true"></div>

  <div id="splash">
    <div class="splash-glow"></div>
    <div class="splash-logo"><img src="img/icono.png" width="128" height="128" alt=""></div>
    <h1>Orbe Espacio</h1>
    <p id="splash-msg">Calculando órbitas…</p>
    <div class="progress"><div id="splash-bar"></div></div>
  </div>

  <!-- HUD superior -->
  <header class="hud">
    <div class="hud-row">
      <div class="brand">
        <span class="brand-dot"></span>
        <div class="brand-text"><b>ORBE ESPACIO</b><small><span class="live">EN VIVO</span><span id="utc">UTC --:--:--</span></small></div>
      </div>
      <button id="btn-search" class="icon-btn" aria-label="Buscar satélite"></button>
      <button id="btn-menu" class="icon-btn" aria-label="Ajustes y Premium"></button>
    </div>

    <!-- Tarjeta de la Estación Espacial en vivo -->
    <button class="iss-card" id="iss-card" aria-label="Ver la Estación Espacial Internacional">
      <span class="iss-ico" id="iss-ico"></span>
      <span class="iss-main">
        <span class="eyebrow">Estación Espacial Internacional</span>
        <b id="iss-over">Calculando posición…</b>
        <span class="telemetry">
          <span><small>ALTITUD</small><em id="iss-alt">—</em><i>km</i></span>
          <span><small>VELOCIDAD</small><em id="iss-vel">—</em><i>km/h</i></span>
          <span><small>A BORDO</small><em id="iss-crew">—</em><i>pers.</i></span>
        </span>
      </span>
    </button>

    <div class="chips" id="cats" role="tablist" aria-label="Tipos de satélite"></div>
  </header>

  <!-- Próximo paso visible -->
  <button class="next-pass" id="next-pass" hidden></button>

  <!-- Hoja de contenido -->
  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div><h2 id="sheet-title">—</h2><p id="sheet-sub"></p></div>
      <button id="sheet-close" class="icon-btn small" aria-label="Cerrar"></button>
    </div>
    <div class="sheet-tabs" id="sheet-tabs"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <!-- Barra de pestañas -->
  <nav class="tabbar" id="tabbar">
    <button data-tab="mapa" aria-selected="true"><span class="ti" data-ico="mapa"></span><span>Mapa</span></button>
    <button data-tab="sats"><span class="ti" data-ico="sats"></span><span>Satélites</span></button>
    <button data-tab="pasos"><span class="ti" data-ico="pasos"></span><span>Verla pasar</span></button>
    <button data-tab="lanz"><span class="ti" data-ico="lanz"></span><span>Lanzamientos</span></button>
    <button data-tab="astro"><span class="ti" data-ico="astro"></span><span>Astronautas</span></button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="lib/globe.gl.min.js"></script>
  <script src="js/tierra-hd.js"></script>
  <script src="lib/satellite.min.js"></script>
  <script src="js/orbitas-worker.js"></script>
  <script src="js/iconos.js"></script>
  <script src="js/espacio.js"></script>
</body>
</html>
