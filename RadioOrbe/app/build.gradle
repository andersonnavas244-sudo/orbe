plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orberadio.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.orberadio.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '2.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Para publicar en Play Store, configura aquí tu propia firma (signingConfig).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Anuncios (AdMob): banner + intersticial
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    // Formulario de consentimiento (obligatorio para usuarios de la UE/Reino Unido)
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'

    // Reproductor (ExoPlayer) + sesión multimedia: título en vivo, Android Auto, widget
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    // Chromecast
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Compra única "Premium sin anuncios"
    implementation 'com.android.billingclient:billing:7.1.1'
}
