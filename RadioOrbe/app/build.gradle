plugins {
    id 'com.android.application'
}

// Firma propia para Play Store: los datos se leen de un archivo FUERA del repositorio
// (por defecto ~/orbe-firma/firma.properties, o la ruta de la variable ORBE_FIRMA). Es la misma llave de todas las apps Orbe.
// Si no existe, el release se firma con la llave de depuración (solo para probar).
def firmaArchivo = file(System.getenv('ORBE_FIRMA') ?: (System.getProperty('user.home') + '/orbe-firma/firma.properties'))
def firma = new Properties()
if (firmaArchivo.exists()) firmaArchivo.withInputStream { firma.load(it) }
def conFirmaPropia = firma.getProperty('storeFile') && firma.getProperty('storePassword') && firma.getProperty('keyAlias') && firma.getProperty('keyPassword')

android {
    namespace 'com.orberadio.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.orberadio.app'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '2.5'
    }

    signingConfigs {
        if (conFirmaPropia) {
            release {
                storeFile file(firma.getProperty('storeFile'))
                storePassword firma.getProperty('storePassword')
                keyAlias firma.getProperty('keyAlias')
                keyPassword firma.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Con ~/orbe-firma/firma.properties firma con la llave propia; si no, con la de depuración.
            signingConfig conFirmaPropia ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Anuncios (AdMob): banner + intersticial
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    // Formulario de consentimiento (obligatorio para usuarios de la UE/Reino Unido)
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'

    // Reproductor (ExoPlayer) + sesión multimedia: título en vivo, Android Auto, widget
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    // Chromecast
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Compra única "Premium sin anuncios"
    implementation 'com.android.billingclient:billing:7.1.1'
}
