plugins {
    id 'com.android.application'
}

// Firma propia para Play Store: los datos se leen de un archivo FUERA del repositorio
// (por defecto ~/orbe-firma/firma.properties, o la ruta de la variable ORBE_FIRMA).
// Lo crea tools-diseno/firmar-juegos.sh. Si no existe, el release se firma con la llave de depuración, como antes.
def firmaArchivo = file(System.getenv('ORBE_FIRMA') ?: (System.getProperty('user.home') + '/orbe-firma/firma.properties'))
def firma = new Properties()
if (firmaArchivo.exists()) firmaArchivo.withInputStream { firma.load(it) }
def conFirmaPropia = firma.getProperty('storeFile') && firma.getProperty('storePassword') && firma.getProperty('keyAlias') && firma.getProperty('keyPassword')

android {
    namespace 'com.orbejuegos.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.orbejuegos.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        if (conFirmaPropia) {
            release {
                storeFile file(firma.getProperty('storeFile'))
                storePassword firma.getProperty('storePassword')
                keyAlias firma.getProperty('keyAlias')
                keyPassword firma.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Con ~/orbe-firma/firma.properties firma con la llave propia; si no, con la de depuración (solo para probar).
            signingConfig conFirmaPropia ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Anuncios (AdMob): solo intersticial entre partidas, con límite (sin banner: los controles del juego van abajo)
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    // Formulario de consentimiento (obligatorio para usuarios de la UE/Reino Unido)
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
    // Suscripción mensual "Premium sin anuncios"
    implementation 'com.android.billingclient:billing:7.1.1'
}
