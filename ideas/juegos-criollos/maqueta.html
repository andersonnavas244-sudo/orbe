<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juegos criollos 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Nunito,system-ui,sans-serif}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
.status{position:fixed;top:12px;left:24px;right:24px;display:flex;justify-content:space-between;font-size:14px;font-weight:900;color:#fff;z-index:3}
.hud-top{position:fixed;left:0;right:0;top:0;padding:44px 18px 26px;background:linear-gradient(rgba(8,5,20,.9),rgba(8,5,20,.55) 70%,rgba(8,5,20,0));color:#fff}
.row{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:'Baloo 2';font-weight:800;font-size:25px;line-height:1.1}
.sub{font-size:13px;color:#e8e0ff;font-weight:800;background:rgba(255,255,255,.12);padding:5px 11px;border-radius:99px}
.teams{margin-top:10px}
.pill{display:flex;gap:9px;align-items:center;padding:7px 15px;border-radius:99px;font-weight:900;font-size:15px}
.pill b{font-size:19px}
.turno{margin-top:9px;font-size:13px;color:#e8e0ff;font-weight:800}
.toast{position:fixed;left:0;right:0;top:29%;text-align:center;font-family:'Baloo 2';font-weight:800;font-size:58px;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 34px rgba(255,170,60,.55)}
.toast small{display:block;font-family:Nunito;font-size:18px;color:#fff;font-weight:900;margin-top:8px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.chip{position:fixed;left:50%;top:27.5%;transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:15px;color:#04301f;background:#3ee0b0;padding:9px 18px;border-radius:99px;box-shadow:0 6px 24px rgba(62,224,176,.45)}
.hud-bot{position:fixed;left:0;right:0;bottom:0;padding:46px 18px 28px;background:linear-gradient(rgba(8,5,20,0),rgba(8,5,20,.88) 38%);color:#fff}
.lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:#e8e0ff}
.bar{height:11px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;border-radius:99px}
.acts{display:flex;gap:12px;align-items:center}
.btn{flex:1;height:58px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:22px;box-shadow:0 6px 0 rgba(0,0,0,.28)}
.efecto{width:58px;height:58px;border-radius:50%;background:#f4f4f4;position:relative;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),0 4px 0 rgba(0,0,0,.25)}
.efecto:after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#e0283c;left:33px;top:13px;box-shadow:0 0 0 3px rgba(224,40,60,.3)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="status"><span>7:30</span><span>5G · 100%</span></div>
<div id="hud"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const JUEGO = Q.get('juego') || 'tejo';
let seed = 11;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

const CFG = {
  tejo: { brand: 'Tejo 3D', sub: 'Ronda 3 de 9', teams: [['Rojos', 21, '#d7263d'], ['Azules', 15, '#2f6fd0']], turno: 'Lanza: Rojos',
    toast: ['¡Mecha!', '+3 puntos', '#ffd34d'], barL: 'Fuerza', barR: 'Mecha 3 · Embocinada 6 · Moñona 9', fill: 78, barC: '#ffb43c',
    btn: 'Lanzar el tejo', btnBg: '#ffc93c', btnC: '#3a2405' },
  bolo: { brand: 'Bolo criollo 3D', sub: 'Chico 4 de 10', teams: [['Chepe', 47, '#e0892a'], ['La Mona', 39, '#8e44ad']], turno: 'Tira: Chepe',
    toast: ['¡Chuza!', 'Tumbaste los 9 bolos', '#ffb347'], barL: 'Fuerza', barR: 'Efecto: curva a la izquierda', fill: 92, barC: '#ff7b3c',
    btn: 'Tirar la bola', btnBg: '#ff9a3c', btnC: '#3a1505' },
  billar: { brand: 'Billar a 3 bandas', sub: 'Chico a 20 · Entrada 9', teams: [['Tú', 14, '#13a37a'], ['El Profe', 11, '#c0392b']], turno: 'Te toca tacar · tiro sugerido a 3 bandas', barL: 'Fuerza', barR: 'Efecto: arriba a la derecha', fill: 64, barC: '#3ee0b0',
    btn: 'Tacar', btnBg: '#3ee0b0', btnC: '#04301f', efecto: true }
}[JUEGO];

function hud() {
  const c = CFG;
  const pill = (t, i) => `<div class="pill" style="background:${i === 0 ? t[2] : 'rgba(255,255,255,.14)'};color:${i === 0 ? '#fff' : '#eee'}">${t[0]} <b>${t[1]}</b></div>`;
  document.getElementById('hud').innerHTML = `
  <div class="hud-top"><div class="row"><span class="brand">${c.brand}</span><span class="sub">${c.sub}</span></div>
    <div class="row teams">${c.teams.map(pill).join('')}</div><div class="turno">${c.turno}</div></div>
  ${c.toast ? `<div class="toast" style="color:${c.toast[2]}">${c.toast[0]}<small>${c.toast[1]}</small></div>` : ''}
  ${c.chip ? `<div class="chip">${c.chip}</div>` : ''}
  <div class="hud-bot"><div class="lbl"><span>${c.barL}</span><span>${c.barR}</span></div>
    <div class="bar"><i style="width:${c.fill}%;background:${c.barC}"></i></div>
    <div class="acts">${c.efecto ? '<div class="efecto"></div>' : ''}<div class="btn" style="background:${c.btnBg};color:${c.btnC}">${c.btn}</div></div></div>`;
}

const cv = document.getElementById('c');
const W = innerWidth, H = innerHeight;
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(devicePixelRatio); R.setSize(W, H, false);
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = { tejo: 0.8, bolo: 1.12, billar: 1.2 }[JUEGO] || 1;
const S = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(50, W / H, 0.03, 200);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const std = o => new THREE.MeshStandardMaterial(o);

function tex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  if (rx) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); }
  return t;
}
function planks(a, b, line, n) {
  return (g, w, h) => {
    const ph = h / n;
    for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? a : b; g.fillRect(0, i * ph, w, ph); g.fillStyle = line; g.fillRect(0, i * ph + ph - 2, w, 2); }
    for (let k = 0; k < 900; k++) { g.fillStyle = 'rgba(30,15,5,' + (rnd() * .16).toFixed(3) + ')'; g.fillRect(rnd() * w, rnd() * h, rnd() * 90 + 10, 1 + rnd()); }
  };
}
function noise(base, spots, n, rmax) {
  return (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let k = 0; k < n; k++) { g.fillStyle = spots[k % spots.length]; g.beginPath(); g.arc(rnd() * w, rnd() * h, rnd() * rmax + .4, 0, 6.3); g.fill(); }
  };
}
const dotTex = tex(128, 128, g => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(255,255,255,.6)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
});
function mesh(geo, mat, pos, parent, shadow) {
  const m = new THREE.Mesh(geo, mat); if (pos) m.position.copy(pos);
  if (shadow !== false) { m.castShadow = true; m.receiveShadow = true; }
  (parent || S).add(m); return m;
}
function sprite(color, pos, scale, opacity, additive) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color, transparent: true, opacity, depthWrite: false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending }));
  s.position.copy(pos); s.scale.setScalar(scale); S.add(s); return s;
}
function points(list, color, size) {
  const g = new THREE.BufferGeometry(); const a = new Float32Array(list.length * 3);
  list.forEach((p, i) => { a[i * 3] = p.x; a[i * 3 + 1] = p.y; a[i * 3 + 2] = p.z; });
  g.setAttribute('position', new THREE.BufferAttribute(a, 3));
  S.add(new THREE.Points(g, new THREE.PointsMaterial({ color, size, map: dotTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })));
}
function signTex(text, bg, border, fg, font) {
  return tex(1024, 240, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h); g.strokeStyle = border; g.lineWidth = 12; g.strokeRect(12, 12, w - 24, h - 24);
    g.fillStyle = fg; let px = parseInt(font.match(/(\d+)px/)[1]); g.font = font;
    while (g.measureText(text).width > w - 110 && px > 40) { px -= 4; g.font = font.replace(/\d+px/, px + 'px'); }
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 6);
  });
}
function lights(y, x0, x1, z, sag) {
  const cols = [0xffd34d, 0xff5a5a, 0x5ad1ff, 0x7dff7a, 0xff9a3c]; const wire = [];
  const flagCols = [0xfcd116, 0xfcd116, 0x003893, 0xce1126];
  const tri = new THREE.Shape(); tri.moveTo(-0.11, 0); tri.lineTo(0.11, 0); tri.lineTo(0, -0.24); tri.lineTo(-0.11, 0);
  const triG = new THREE.ShapeGeometry(tri);
  const n = 22;
  for (let i = 0; i <= n; i++) {
    const u = i / n, x = x0 + (x1 - x0) * u, yy = y - sag * 4 * u * (1 - u);
    wire.push(V(x, yy, z));
    if (i % 2 === 0) {
      const b = mesh(new THREE.SphereGeometry(0.06, 14, 14), new THREE.MeshBasicMaterial({ color: cols[(i / 2) % 5], toneMapped: false }), V(x, yy - 0.09, z), S, false);
      sprite(cols[(i / 2) % 5], b.position, 0.42, 0.45, true);
    } else {
      const f = mesh(triG, std({ color: flagCols[i % 4], side: THREE.DoubleSide, roughness: .8 }), V(x, yy, z + 0.01), S, false);
      f.rotation.z = (rnd() - .5) * .15;
    }
  }
  S.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(wire), new THREE.LineBasicMaterial({ color: 0x1a1a1a })));
}

/* ---------------------------- TEJO ---------------------------- */
function escenaTejo() {
  S.background = new THREE.Color(0x150d28); S.fog = new THREE.Fog(0x150d28, 14, 32);
  const woodM = std({ map: tex(512, 512, planks('#7a5030', '#5e3c21', 'rgba(0,0,0,.4)', 10)), roughness: .72 });
  const fl = mesh(new THREE.PlaneGeometry(40, 40), std({ map: tex(512, 512, planks('#6b4a35', '#57392a', 'rgba(0,0,0,.45)', 14), 7, 7), roughness: .9 }), V(0, 0, 0));
  fl.rotation.x = -Math.PI / 2;
  mesh(new THREE.PlaneGeometry(18, 9), std({ map: tex(512, 512, planks('#5b4038', '#4a322b', 'rgba(0,0,0,.5)', 12), 3, 2), roughness: .95 }), V(0, 4.5, -2.7));
  const sign = mesh(new THREE.PlaneGeometry(3.6, 0.85), new THREE.MeshBasicMaterial({ map: signTex('Tejódromo Orbe', '#a32424', '#ffd34d', '#fff3d6', '800 150px "Baloo 2", sans-serif') }), V(-0.08, 2.5, -2.65), S, false);
  sign.scale.setScalar(0.58);
  lights(3.35, -4.5, 4.5, -2.25, 0.35);
  lights(3.9, -4.5, 4.5, 1.2, 0.4);

  S.add(new THREE.HemisphereLight(0xc7b3ff, 0x3a2414, 0.42));
  const sun = new THREE.DirectionalLight(0xffe2b8, 1.0); sun.position.set(2.5, 6.5, 4.5); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 1, far: 22 }); sun.shadow.bias = -0.0005; S.add(sun);
  const bulb = new THREE.PointLight(0xffc070, 1.0, 10); bulb.position.set(0, 3.3, 1.2); S.add(bulb);

  const TILT = 0.78;
  const cancha = new THREE.Group(); cancha.position.set(0, 0.95, 0); cancha.rotation.x = -TILT; S.add(cancha);
  const clayT = tex(1024, 1024, (g, w, h) => {
    noise('#6f5847', ['rgba(60,45,35,.25)', 'rgba(175,155,135,.22)', 'rgba(95,75,60,.3)'], 9000, 4)(g, w, h);
    for (let k = 0; k < 9; k++) { const x = rnd() * w, y = rnd() * h, r = 26 + rnd() * 18; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(40,28,20,.55)'); gr.addColorStop(1, 'rgba(40,28,20,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.3); g.fill(); }
  });
  mesh(new THREE.BoxGeometry(2, 2, 0.2), std({ map: clayT, roughness: 1 }), V(0, 0, -0.1), cancha);
  [[0, 1.075, 2.3, 0.15], [0, -1.075, 2.3, 0.15], [1.075, 0, 0.15, 2.0], [-1.075, 0, 0.15, 2.0]].forEach(a => mesh(new THREE.BoxGeometry(a[2], a[3], 0.36), woodM, V(a[0], a[1], 0.02), cancha));
  mesh(new THREE.BoxGeometry(2.3, 1.78, 0.12), woodM, V(0, 0.89, -0.94));
  mesh(new THREE.BoxGeometry(2.3, 0.16, 0.32), woodM, V(0, 0.08, 0.86));
  mesh(new THREE.TorusGeometry(0.22, 0.035, 20, 64), std({ color: 0xa9b1ba, metalness: .9, roughness: .28 }), V(0, 0, 0.015), cancha);
  mesh(new THREE.CircleGeometry(0.19, 40), std({ color: 0x2a2019, roughness: 1 }), V(0, 0, 0.003), cancha);

  const tri = s => { const sh = new THREE.Shape(); sh.moveTo(0, 0.17 * s); sh.lineTo(-0.1 * s, -0.04 * s); sh.lineTo(0.1 * s, -0.04 * s); sh.lineTo(0, 0.17 * s); return new THREE.ExtrudeGeometry(sh, { depth: 0.03, bevelEnabled: false }); };
  const gBig = tri(1), gSmall = tri(0.55);
  const mW = std({ color: 0xf6f2e8, roughness: .85 }), mR = std({ color: 0xd8343f, roughness: .7 });
  const HIT = 1;
  [Math.PI / 2, 0, Math.PI, -Math.PI / 2].forEach((a, i) => {
    if (i === HIT) return;
    const g = new THREE.Group(); g.position.set(Math.cos(a) * 0.26, Math.sin(a) * 0.26, 0.03); g.rotation.z = a - Math.PI / 2;
    const inner = new THREE.Group(); inner.rotation.x = 0.9; g.add(inner);
    mesh(gBig, mW, null, inner); const r1 = mesh(gSmall, mR, V(0, 0.01, 0.004), inner); const r2 = mesh(gSmall, mR, V(0, 0.01, -0.004), inner);
    cancha.add(g);
  });
  const tejoGeo = new THREE.CylinderGeometry(0.13, 0.14, 0.06, 48);
  const tejoM = std({ color: 0xc9a25e, metalness: .85, roughness: .26 });
  const hitLocal = V(0.27, 0.0, 0.0);
  const t1 = mesh(tejoGeo, tejoM, hitLocal, cancha); t1.rotation.set(Math.PI / 2 + 0.12, 0, 0.2);
  const t2 = mesh(tejoGeo, std({ color: 0x8f969e, metalness: .85, roughness: .32 }), V(-0.52, 0.58, 0.0), cancha); t2.rotation.set(Math.PI / 2 - 0.1, 0, 0);
  S.updateMatrixWorld(true);
  const p = hitLocal.clone(); cancha.localToWorld(p); p.add(V(0, 0.06, 0.05));
  const nrm = V(0, Math.sin(TILT), Math.cos(TILT));

  const from = V(0.55, 1.3, 5.2), to = p.clone();
  for (let u = 0.3; u < 0.97; u += 0.04) {
    const q = from.clone().lerp(to, u); q.y += 2.0 * 4 * u * (1 - u);
    const k = (u - 0.3) / 0.67;
    mesh(new THREE.SphereGeometry(0.012 + 0.03 * k, 10, 10), new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0.15 + 0.55 * k, toneMapped: false }), q, S, false);
  }
  const boom = new THREE.PointLight(0xff8a2a, 4, 5); boom.position.copy(p).add(V(0, 0.35, 0.35)); S.add(boom);
  sprite(0xff6a10, p, 1.0, 0.6, true);
  sprite(0xffc060, p, 0.5, 0.75, true);
  sprite(0xffffff, p, 0.18, 0.9, true);
  const sparks = [], core = [];
  for (let i = 0; i < 320; i++) {
    const v = V(rnd() - .5, rnd() - .5, rnd() - .5).normalize().multiplyScalar(1 + rnd() * 2.8).addScaledVector(nrm, 1.5);
    const t = 0.1 + rnd() * 0.22;
    const q = p.clone().addScaledVector(v, t); q.y -= 3 * t * t;
    (i % 3 ? sparks : core).push(q);
  }
  points(sparks, 0xffa040, 0.075); points(core, 0xfff0c0, 0.05);
  for (let i = 0; i < 12; i++) sprite(0x6e675e, p.clone().add(V((rnd() - .5) * .6, 0.25 + rnd() * .6, (rnd() - .5) * .5)), 0.25 + rnd() * .4, 0.2, false);
  for (let i = 0; i < 18; i++) {
    const f = mesh(new THREE.PlaneGeometry(0.05, 0.035), std({ color: i % 3 ? 0xf6f2e8 : 0xd8343f, side: THREE.DoubleSide }), p.clone().add(V((rnd() - .5) * 1.0, rnd() * .8, (rnd() - .5) * .7)), S, false);
    f.rotation.set(rnd() * 6, rnd() * 6, rnd() * 6);
  }
  cam.fov = 48; cam.position.set(0.45, 1.8, 5.5); cam.lookAt(0, 1.02, 0);
}

/* ---------------------------- BOLO ---------------------------- */
function escenaBolo() {
  S.background = tex(8, 512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#16204a'); gr.addColorStop(.3, '#4a3270'); gr.addColorStop(.5, '#c76a5c'); gr.addColorStop(.6, '#f2a865'); gr.addColorStop(1, '#f6c27a');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  S.fog = new THREE.Fog(0xe39563, 22, 90);
  const grass = mesh(new THREE.PlaneGeometry(300, 300), std({ map: tex(512, 512, noise('#3f6a2a', ['#4d7d33', '#355a22', '#5a8a3a'], 6000, 3), 40, 40), roughness: 1 }), V(0, 0, 0));
  grass.rotation.x = -Math.PI / 2;
  for (let i = 0; i < 15; i++) {
    const r = 9 + rnd() * 12, hh = 4 + rnd() * 7;
    const m = mesh(new THREE.ConeGeometry(r, hh, 9), std({ color: i % 2 ? 0x2c4a3a : 0x35553f, flatShading: true, roughness: 1 }), V(-80 + i * 12 + rnd() * 6, hh / 2 - 1, -85 - rnd() * 30), S, false);
  }
  const trunkM = std({ color: 0x5a3b22, roughness: 1 }), leafM = std({ color: 0x2f6b2f, roughness: 1, flatShading: true });
  [[-4.2, -3], [4.5, -5], [-5.5, -9], [5.2, -11], [-3.6, 2], [6.5, 0]].forEach(([x, z]) => {
    mesh(new THREE.CylinderGeometry(0.12, 0.16, 2.2, 8), trunkM, V(x, 1.1, z));
    mesh(new THREE.IcosahedronGeometry(1.1 + rnd() * .4, 1), leafM, V(x, 2.7, z));
  });

  const laneT = tex(512, 1024, (g, w, h) => {
    const n = 8, pw = w / n;
    for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? '#b07b46' : '#9c6a3a'; g.fillRect(i * pw, 0, pw, h); g.fillStyle = 'rgba(40,20,5,.45)'; g.fillRect(i * pw + pw - 3, 0, 3, h); }
    for (let k = 0; k < 1500; k++) { g.fillStyle = 'rgba(40,20,5,' + (rnd() * .14).toFixed(3) + ')'; g.fillRect(rnd() * w, rnd() * h, 1 + rnd(), rnd() * 120 + 20); }
  }, 1, 3);
  const laneM = std({ map: laneT, roughness: .55 });
  const LEN = 14, Z0 = -1.5;
  mesh(new THREE.BoxGeometry(1.8, 0.12, LEN), laneM, V(0, 0.06, Z0));
  const darkWood = std({ map: tex(256, 256, planks('#5a3a20', '#4a2f19', 'rgba(0,0,0,.4)', 6)), roughness: .8 });
  mesh(new THREE.BoxGeometry(0.14, 0.3, LEN), darkWood, V(-0.97, 0.15, Z0));
  mesh(new THREE.BoxGeometry(0.14, 0.3, LEN), darkWood, V(0.97, 0.15, Z0));
  mesh(new THREE.BoxGeometry(2.3, 1.3, 0.3), darkWood, V(0, 0.65, Z0 - LEN / 2 - 0.1));
  mesh(new THREE.BoxGeometry(2.1, 0.4, 0.12), new THREE.MeshBasicMaterial({ map: signTex('Bolo criollo', '#1d4f91', '#fcd116', '#ffffff', '800 150px "Baloo 2", sans-serif') }), V(0, 1.58, Z0 - LEN / 2 + 0.05), S, false);
  const postM = std({ color: 0x6b4426, roughness: .9 });
