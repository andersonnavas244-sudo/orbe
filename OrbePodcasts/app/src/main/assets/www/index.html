<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#03050c">
  <title>Orbe Podcasts</title>
  <link rel="stylesheet" href="css/podcasts.css">
  <link rel="stylesheet" href="css/uhd.css">
</head>
<body>
  <div id="defs-host"></div>
  <div id="globe" aria-label="Globo terráqueo con los podcasts más escuchados de cada país"></div>

  <div id="splash">
    <div class="splash-glow"></div>
    <div class="splash-logo"><img src="img/icono.png" width="128" height="128" alt=""></div>
    <h1>Orbe Podcasts</h1>
    <p id="splash-msg">Sintonizando el mundo…</p>
    <div class="progress"><div id="splash-bar"></div></div>
  </div>

  <header class="hud">
    <div class="hud-row">
      <div class="brand">
        <span class="brand-dot"></span>
        <div class="brand-text"><b>ORBE PODCASTS</b><small><span class="cnt" id="count">—</span></small></div>
      </div>
      <button id="btn-country" class="country-btn" aria-label="Elegir país"><span class="fl" id="cc-flag">🌐</span><span id="cc-name">País</span></button>
      <button id="btn-menu" class="icon-btn" aria-label="Ajustes y Premium"></button>
    </div>
    <div class="chips" id="genres" role="tablist" aria-label="Géneros"></div>
  </header>

  <!-- Reproductor pequeño -->
  <div class="mini" id="mini" hidden>
    <button class="art" id="mini-art" aria-label="Abrir el reproductor"></button>
    <button class="tx" id="mini-tx"><b id="mini-title">—</b><small id="mini-sub">—</small></button>
    <button class="ctl" id="mini-fwd" aria-label="Adelantar 30 segundos"></button>
    <button class="ctl main" id="mini-play" aria-label="Reproducir o pausar"></button>
    <span class="pbar"><i id="mini-bar"></i></span>
  </div>

  <section class="sheet" id="sheet" aria-hidden="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div><h2 id="sheet-title">—</h2><p id="sheet-sub"></p></div>
      <button id="sheet-close" class="icon-btn small" aria-label="Cerrar"></button>
    </div>
    <div class="sheet-tabs" id="sheet-tabs"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <nav class="tabbar" id="tabbar">
    <button data-tab="mapa" aria-selected="true"><span class="ti" data-ico="mapa"></span><span>Mapa</span></button>
    <button data-tab="explorar"><span class="ti" data-ico="explorar"></span><span>Explorar</span></button>
    <button data-tab="biblioteca"><span class="ti" data-ico="biblioteca"></span><span>Biblioteca</span></button>
    <button data-tab="buscar"><span class="ti" data-ico="buscar"></span><span>Buscar</span></button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="lib/globe.gl.min.js"></script>
  <script src="js/tierra-hd.js"></script>
  <script src="js/iconos.js"></script>
  <script src="js/podcasts.js"></script>
</body>
</html>
